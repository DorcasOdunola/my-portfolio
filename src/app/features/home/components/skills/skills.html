<section id="skills" class="py-20 lg:py-28 bg-slate-50 dark:bg-slate-950 relative border-t border-slate-200/80 dark:border-slate-800/80 transition-colors duration-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    
    <!-- Section Header -->
    <div class="max-w-3xl mb-16">
      <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400 mb-3">Skills & Technical Stack</h2>
      <p class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white tracking-tight mb-4">
        A modern toolkit focused on scalability and clean architecture.
      </p>
      <p class="text-base sm:text-lg text-slate-600 dark:text-slate-400">
        Combining front-end reactive frameworks with robust PHP/Laravel backends and database systems to deliver full-stack enterprise solutions.
      </p>
    </div>

    <!-- Category Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
      <div *ngFor="let cat of categories" 
           class="p-8 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-sm hover:shadow-md hover:border-indigo-200 dark:hover:border-indigo-500/30 transition-all flex flex-col justify-between">
        
        <div>
          <!-- Header & Icon -->
          <div class="flex items-center gap-4 mb-6">
            <div [class]="'w-12 h-12 rounded-xl flex items-center justify-center font-bold ' + cat.iconBg + ' ' + cat.iconColor">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-bold text-slate-900 dark:text-white">{{ cat.title }}</h3>
              <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">{{ cat.subtitle }}</p>
            </div>
          </div>

          <!-- Skills Badges List -->
          <div class="flex flex-wrap gap-2.5 pt-2">
            <div *ngFor="let item of cat.skills" 
                 class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm font-medium bg-slate-100 dark:bg-slate-800 text-slate-800 dark:text-slate-200 border border-slate-200/60 dark:border-slate-700/60 hover:bg-slate-200/60 dark:hover:bg-slate-700/60 transition-colors">
              <span>{{ item.name }}</span>
              <span *ngIf="item.tag" class="px-1.5 py-0.5 text-[10px] uppercase font-bold tracking-wider rounded bg-indigo-600 text-white dark:bg-indigo-500">
                {{ item.tag }}
              </span>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>
</section>
